[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chinmaye HG", email = "chinmaye115@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "clerk-backend-api>=7.0.0",
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "livekit-agents",
    "livekit-api",
    "livekit-plugins-deepgram",
    "livekit-plugins-groq",
    "livekit-plugins-silero",
    "pydantic[email]>=2.14.1",
    "pymongo>=4.9",
    "pytest>=9.1.1",
    "python-dotenv",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
